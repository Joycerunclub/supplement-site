<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單完成 - 有意思補給站</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
</head>
<body>
<nav id="navbar">
  <a href="index.html" class="nav-logo">有意思補給站 <span>JOYCE SUPPLY</span></a>
  <button class="hamburger" id="hamburger">&#9776;</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">首頁</a></li>
    <li><a href="products.html">補給品目錄</a></li>
    <li><a href="strategy.html">賽事攻略</a></li>
    <li><a href="mylog.html">我的紀錄</a></li>
    <li><a href="order.html" class="nav-cta">立即訂購</a></li>
  </ul>
</nav>

<section class="ty-section" style="margin-top:64px;">
  <div class="ty-box">
    <div class="ty-icon">🎉</div>
    <h1 class="ty-title">訂單送出成功！</h1>
    <p class="ty-sub" id="ty-msg">
      感謝你的訂購！<br>
      我們會盡快透過 LINE 或電話與你確認訂單，<br>
      確認付款後安排出貨 🧡
    </p>
    <div style="background:var(--cream);border:1px solid var(--border);padding:24px;margin-bottom:32px;text-align:left;" id="order-recap"></div>
    <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
      <a href="order.html" class="btn btn-gold">繼續購買</a>
      <a href="index.html" class="btn btn-outline">回首頁</a>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">有意思補給站</div>
    <div class="footer-links">
      <a href="index.html">首頁</a>
      <a href="products.html">補給品目錄</a>
      <a href="order.html">立即訂購</a>
    </div>
    <div class="footer-copy">© 2025 有意思補給站. All rights reserved.</div>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
const order = JSON.parse(localStorage.getItem('last_order') || '{}');
if (order.name) {
  document.getElementById('ty-msg').innerHTML =
    `<strong>${order.name}</strong>，感謝你的訂購！<br>我們會盡快透過 LINE 或電話與你確認訂單，<br>確認付款後安排出貨 🧡`;
  document.getElementById('order-recap').innerHTML =
    `<div style="font-size:12px;letter-spacing:0.1em;color:var(--gold-dark);margin-bottom:12px;">◆ 訂單內容</div>
     <pre style="font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.9;">${order.items}</pre>
     <div style="font-family:'DM Serif Display',serif;font-size:24px;color:var(--gold);margin-top:12px;">合計 ${order.total}</div>`;
}
</script>
</body>
</html>
